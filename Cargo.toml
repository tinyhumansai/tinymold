[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the `tinymold` binary is `crates/tinymold`, the same as any other
# member, so no crate is structurally special.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymold"

[workspace.dependencies]
# Internal crates. No `version` requirement on purpose: the workspace version
# moves on every release, and a pinned requirement here would stop resolving the
# moment it did. Nothing in this workspace is published, so the path is the
# whole address.
tinymold-hash = { path = "crates/tinymold-hash" }
tinymold-cas = { path = "crates/tinymold-cas" }
# BLAKE3 is the digest for every persisted or shared cache key and object (see
# docs/adr/0002-blake3-for-content-digests.md). Default features keep the SIMD
# backends and runtime CPU detection; `mmap` and `rayon` stay off until the
# hashing layer is benchmarked with them.
blake3 = "1"
# Copy-on-write clones (`clonefile` on APFS, `FICLONE` on btrfs/XFS) for
# materializing store objects without copying bytes. It wraps the platform
# calls so this workspace keeps `unsafe_code = "forbid"`.
reflink-copy = "0.1"
# Derive macros for each crate's error type in `src/error/`.
thiserror = "2"
# Argument parsing for the `tinymold` command-line interface.
clap = { version = "4", features = ["derive"] }
# Isolated, self-cleaning directories for tests that touch the filesystem.
tempfile = "3"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
