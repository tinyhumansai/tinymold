[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the `tinymold` binary is `crates/tinymold`, the same as any other
# member, so no crate is structurally special.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
# `bench/.work/` holds the benchmark corpus checkouts, which are separate
# projects and must not be absorbed into this workspace.
exclude = ["worktrees", "bench/.work"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so every crate releases under the one version the release workflow
# bumps here (together with the internal requirements below).
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymold"

[workspace.dependencies]
# Internal crates. Every crate is published to crates.io, and a published
# manifest needs a version requirement on each path dependency, so these carry
# the workspace version exactly. The release workflow rewrites these
# requirements together with `[workspace.package] version`, so they never
# drift apart.
tinymold-hash = { path = "crates/tinymold-hash", version = "=0.0.1" }
tinymold-cas = { path = "crates/tinymold-cas", version = "=0.0.1" }
tinymold-key = { path = "crates/tinymold-key", version = "=0.0.1" }
tinymold-wrap = { path = "crates/tinymold-wrap", version = "=0.0.1" }
tinymold-remote = { path = "crates/tinymold-remote", version = "=0.0.1" }
tinymold-store = { path = "crates/tinymold-store", version = "=0.0.1" }
tinymold-server = { path = "crates/tinymold-server", version = "=0.0.1" }
# BLAKE3 is the digest for every persisted or shared cache key and object (see
# docs/adr/0002-blake3-for-content-digests.md). Default features keep the SIMD
# backends and runtime CPU detection; `mmap` and `rayon` stay off until the
# hashing layer is benchmarked with them.
blake3 = "1"
# Copy-on-write clones (`clonefile` on APFS, `FICLONE` on btrfs/XFS) for
# materializing store objects without copying bytes. It wraps the platform
# calls so this workspace keeps `unsafe_code = "forbid"`.
reflink-copy = "0.1"
# Derive macros for each crate's error type in `src/error/`.
thiserror = "2"
# Argument parsing for the `tinymold` command-line interface.
clap = { version = "4", features = ["derive"] }
# The remote tier's REAPI client (docs/adr/0006-remote-tier-reapi-bazel-remote.md),
# used only by `tinymold-remote`. tonic carries gRPC over HTTP/2 with rustls
# for `grpcs://` servers; its default features (codegen, router, server) stay
# off, since the client is written by hand. prost encodes the dozen REAPI
# messages, derived by hand rather than generated, so no protoc is needed.
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
# The runtime the gRPC client runs on: one current-thread runtime per wrapper
# process, entered only when a remote is configured.
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
# The gRPC method paths tonic's generic client takes (`PathAndQuery`); tonic
# already depends on it, so it adds no build time.
http = { version = "1", default-features = false }
# Turns a list of ByteStream write chunks into the request stream tonic sends.
tokio-stream = { version = "0.1", default-features = false }
# `tinymold serve`'s HTTP stack (docs/specs/cache-server.md): hyper serves
# HTTP/1.1 and HTTP/2 on one listener through hyper-util's auto builder, and
# http-body-util streams bodies. tonic already builds hyper, hyper-util,
# http-body-util, bytes, base64 and tokio-rustls for the REAPI client, so the
# server adds features to crates the workspace already compiles, not crates.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
# Basic-auth credentials (Gradle, Bazel HTTP, REAPI) arrive base64-encoded.
base64 = { version = "0.22", default-features = false, features = ["std"] }
# TLS for `tinymold serve --tls-cert/--tls-key`, with the ring provider tonic
# already uses; rustls-pki-types reads the PEM files.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
# SHA-256 for blobs on REAPI servers that only accept it, such as bazel-remote
# (the translation layer of docs/adr/0002-blake3-for-content-digests.md), and
# for `tinymold-store`'s index of blobs by the SHA-256 that REAPI and Bazel
# HTTP clients name them with (docs/specs/cache-server.md).
sha2 = { version = "0.11", default-features = false }
# Isolated, self-cleaning directories for tests that touch the filesystem.
tempfile = "3"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
