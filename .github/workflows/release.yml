name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The workspace member that ships the `tinymold` binary. Its version is the
  # release version; every other member inherits the same one.
  RELEASE_PACKAGE: tinymold

jobs:
  prepare:
    name: Prepare release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .name' <<< "$metadata")"
          current_version="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .version' <<< "$metadata")"
          if [[ -z "$crate_name" || "$crate_name" == "null" ]]; then
            echo "Could not resolve the crate name" >&2
            exit 1
          fi
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
            tag_exists=true
          else
            # `current` without a tag releases the version already in
            # Cargo.toml as-is: this is how the first release (0.0.1) ships.
            tag_exists=false
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
            echo "tag_exists=${tag_exists:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          # One version for the whole workspace: every member inherits it with
          # `version.workspace = true`. Internal path dependencies carry an
          # exact `version = "=X.Y.Z"` requirement because crates.io needs one,
          # so they move in the same edit.
          perl -0pi -e 's/(\[workspace\.package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          perl -pi -e 's/(path = "crates\/[^"]+", version = "=)[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          # `--workspace` re-resolves the local packages only, which is what a
          # version bump changes. `-p <name> --precise` cannot express "and the
          # other member moved too".
          cargo update --workspace
          released="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "$CRATE_NAME" \
              '.packages[] | select(.name == $name) | .version')"
          if [[ "$released" != "$NEXT_VERSION" ]]; then
            echo "version bump did not take: expected ${NEXT_VERSION}, got ${released}" >&2
            exit 1
          fi

      - name: Commit version bump and tag
        if: ${{ steps.version.outputs.tag_exists != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$BUMP" != "current" ]]; then
            git add Cargo.toml Cargo.lock
            git commit -m "Release ${RELEASE_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

  binaries:
    name: Binary (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 links against an older glibc than 24.04, so one Linux
          # build runs on every supported distribution release.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --package ${{ env.RELEASE_PACKAGE }} --bin tinymold

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tinymold"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          "$binary" --version
          "$binary" doctor

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail
          name="tinymold-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE "dist/${name}/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/tinymold.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/tinymold" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tinymold-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tinymold-*
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          assets=(*.tar.gz *.zip)
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "expected 6 binary archives, found ${#assets[@]}" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Create immutable release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets are unchanged."
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

  crates-io:
    name: Publish to crates.io
    needs:
      - prepare
      - binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Crates are published leaf-first so each one's internal dependencies
      # already exist on crates.io. A version that is already published is
      # skipped, which is what lets `bump: current` resume a release that
      # failed partway through publishing.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not set; add it as a repository secret" >&2
            exit 1
          fi
          crates=(tinymold-hash tinymold-cas tinymold-key tinymold-wrap tinymold-remote tinymold)
          # A member missing from the list would never reach crates.io, and
          # publishing anything that depends on it would then fail.
          members="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[].name' | sort | tr '\n' ' ')"
          listed="$(printf '%s\n' "${crates[@]}" | sort | tr '\n' ' ')"
          if [[ "$members" != "$listed" ]]; then
            echo "publish list (${listed}) does not match the workspace members (${members})" >&2
            exit 1
          fi
          for crate in "${crates[@]}"; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A "tinymold-release (https://github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            if [[ "$status" == "200" ]]; then
              echo "${crate} ${VERSION} is already on crates.io; skipping."
              continue
            fi
            cargo publish --locked --package "$crate"
          done

  major-tag:
    name: Move the major version tag
    needs:
      - prepare
      - github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Workflows pin the action as `tinyhumansai/tinymold@v0`, so the major
      # tag follows the newest release in that series. It is the one tag that
      # moves; release tags are never rewritten.
      - name: Point the major tag at this release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          major="${RELEASE_TAG%%.*}"
          git tag -f "$major" "${RELEASE_TAG}^{commit}"
          git push --force origin "refs/tags/${major}"
