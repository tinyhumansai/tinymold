name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lint levels live in `[workspace.lints]` in the root Cargo.toml so local and
  # CI runs agree; don't add a blanket RUSTFLAGS here.
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repository code (cargo build/test); don't persist
          # the token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Test default features
        run: cargo test

      # `cargo build --all-targets` only *compiles* an example. `AGENTS.md`
      # promises `cargo run -p tinymold --example basic` works, and a compiled
      # example can still fail on its first line.
      - name: Run the bundled example
        run: cargo run -p tinymold --example basic

      - name: Run the doctor against this runner
        run: cargo run -p tinymold -- doctor

      # Every crate is published to crates.io. Packaging verifies what
      # `cargo publish` would upload — manifest metadata, version requirements
      # on internal crates, and that each crate builds from its packaged
      # sources alone — so a release cannot discover it after tagging.
      - name: Package every crate for crates.io
        run: cargo package --workspace --locked

      # The benchmark harness is plain-stdlib Python that CI cannot afford to
      # run on every push; at least make sure it still parses.
      - name: Check the benchmark scripts compile
        run: python3 -m py_compile bench/bench.py bench/report.py

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 coverage.json

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `rust-version` is inherited from `[workspace.package]`, so every member
      # reports the same value. Read it off the package the module ships as
      # rather than off `packages[0]`, whose order cargo does not promise.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "tinymold") | .rust_version')"
          if [[ -z "$msrv" || "$msrv" == "null" ]]; then
            echo "workspace.package.rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with the declared MSRV
        run: cargo build --all-targets --all-features

  # The GitHub Action in this repository (action.yml, save/action.yml), run on
  # this repository with its stateless backend: the store travels in GitHub's
  # cache. The second job starts on a fresh runner and must be served almost
  # entirely from what the first stored.
  action-fill:
    name: Action (GitHub cache, fill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./
        with:
          install: source
          cache-key: self-test

      - name: Build and test
        run: |
          cargo build --locked --all-targets --all-features
          cargo test --locked --all-features --no-run

      - uses: ./save
        if: always()

  action-reuse:
    name: Action (GitHub cache, reuse)
    needs: action-fill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./
        with:
          install: source
          cache-key: self-test

      - name: Build and test from the restored store
        run: |
          cargo build --locked --all-targets --all-features
          cargo test --locked --all-features --no-run

      - name: Require a warm build
        run: tinymold stats --min-hit-rate 90

      - uses: ./save
        if: always()

  # The remote tier against a real bazel-remote, the reference server of
  # docs/adr/0006-remote-tier-reapi-bazel-remote.md: build and push, wipe every
  # local trace, then build again from the remote alone.
  remote-e2e:
    name: Remote cache (bazel-remote)
    runs-on: ubuntu-latest
    env:
      # A throwaway credential for the container below, not a secret.
      REMOTE_AUTH: ci:ci-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Start bazel-remote
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/bazel-remote"
          mkdir -p "${config}"
          echo "ci:$(openssl passwd -apr1 ci-password)" > "${config}/htpasswd"
          docker run -d --name bazel-remote -p 9092:9092 \
            -v "${config}:/etc/bazel-remote:ro" \
            buchgr/bazel-remote-cache:v2.6.2 \
            --dir=/tmp/cache --max_size=5 \
            --htpasswd_file=/etc/bazel-remote/htpasswd --allow_unauthenticated_reads
          for _ in $(seq 30); do
            if nc -z 127.0.0.1 9092; then exit 0; fi
            sleep 1
          done
          docker logs bazel-remote
          exit 1

      - uses: ./
        with:
          install: source
          backend: remote
          remote-url: grpc://127.0.0.1:9092
          remote-auth: ${{ env.REMOTE_AUTH }}

      - name: Check the server and the credential
        run: tinymold remote check

      - name: Build and push
        run: |
          cargo build --locked --all-targets --all-features
          tinymold remote push --since "${TINYMOLD_SAVE_START}"

      - name: Build again from the remote alone
        run: |
          set -euo pipefail
          rm -rf target "${TINYMOLD_STORE}" "${TINYMOLD_LOG}"
          cargo build --locked --all-targets --all-features
          tinymold stats --min-hit-rate 90

      - uses: ./save
        if: always()
        with:
          push: "false"

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
