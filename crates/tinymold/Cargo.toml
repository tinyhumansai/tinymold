[package]
name = "tinymold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Make Rust builds fast and small: content-addressed build caching, fast linking, and a hot cache server for cargo."
readme = "../../README.md"
keywords = ["build", "cache", "cargo", "linker", "compile-time"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "tinymold"
path = "src/main.rs"

[dependencies]
tinymold-hash = { workspace = true }
tinymold-cas = { workspace = true }
tinymold-wrap = { workspace = true }
tinymold-remote = { workspace = true, optional = true }
tinymold-server = { workspace = true, optional = true }
# The cache server's store, which `tinymold gocacheprog` keeps Go's build
# cache in. It has no network or async dependencies.
tinymold-store = { workspace = true }
# Go's `GOCACHEPROG` protocol carries bytes as base64 (`tinymold gocacheprog`).
base64 = { workspace = true }
clap = { workspace = true }
# Copy-on-write clones of whole target directories for `tinymold snapshot`.
reflink-copy = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["remote", "server"]
# The remote cache tier (`TINYMOLD_REMOTE_URL`, `tinymold remote push|check`).
# It brings in the gRPC client and its async runtime; without it the binary is
# local-only and noticeably faster to build.
remote = ["dep:tinymold-remote"]
# The cache server (`tinymold serve`, docs/specs/cache-server.md). It brings
# in the HTTP server stack; without it the binary has no `serve` command.
server = ["dep:tinymold-server"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
