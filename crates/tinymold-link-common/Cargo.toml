[package]
name = "tinymold-link-common"
version.workspace = true
edition.workspace = true
# mold needs a newer compiler than the rest of the workspace (let chains and
# other 1.95 features), and keeps its own MIT license; see FORK.md.
rust-version = "1.95"
license = "MIT"
repository.workspace = true
description = "tinymold-link's shared linker code, forked from mold-common"

[lib]
path = "lib.rs"

[dependencies]
bstr = "1"
cpp_demangle = "0.5.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc.workspace = true
libz-rs-sys = "0.6.8"
memchr = "2.8.3"
memmap2 = "0.9"
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1"
rustc-demangle = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zlib-rs = { version = "0.6.8", default-features = false }
zstd = "0.13"
