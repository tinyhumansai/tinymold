[package]
name = "tinymold-link"
version.workspace = true
edition.workspace = true
# mold requires Rust 1.95, newer than the rest of the workspace, and keeps
# its own MIT license; see FORK.md.
rust-version = "1.95"
license = "MIT"
repository.workspace = true
description = "A linker for Rust dev loops, forked from mold, that keeps state between links"
readme = "README.md"
keywords = ["linker", "elf", "mach-o"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "tinymold-link"
path = "main.rs"

# mold's shell test suite, run against this binary. It drives real
# compilers and binutils, and takes minutes, so it runs only when
# TINYMOLD_LINK_SHELL_TESTS is set (see integration.rs).
[[test]]
name = "integration"
path = "integration.rs"
harness = false

[dependencies]
mimalloc = { package = "mold-mimalloc", version = "0.1.52" }
mold-elf.workspace = true
mold-elf-x86_64 = { workspace = true, optional = true }
mold-elf-arm64 = { workspace = true, optional = true }
mold-macho.workspace = true
mold-macho-arm64 = { workspace = true, optional = true }
mold-macho-x86_64 = { workspace = true, optional = true }

[dev-dependencies]
mold-tests = { package = "tinymold-link-tests", path = "../tinymold-link-tests" }

# One feature per target. The fork keeps the two targets Rust developers
# link for most, ELF and Mach-O on x86_64 and arm64; mold's other eighteen
# ELF targets stay upstream.
[features]
default = ["x86_64", "arm64", "macho-arm64", "macho-x86_64"]
# Use the system allocator instead of mimalloc.
system-allocator = []
x86_64 = ["dep:mold-elf-x86_64"]
arm64 = ["dep:mold-elf-arm64"]
macho-arm64 = ["dep:mold-macho-arm64"]
macho-x86_64 = ["dep:mold-macho-x86_64"]
