[package]
name = "tinymold-link-elf"
version.workspace = true
edition.workspace = true
# mold requires Rust 1.95, newer than the rest of the workspace, and keeps
# its own MIT license; see crates/tinymold-link/FORK.md.
rust-version = "1.95"
license = "MIT"
repository.workspace = true
description = "tinymold-link's ELF linker, forked from mold-elf"

[lib]
path = "lib.rs"

[dependencies]
blake3 = "1.8.7"
bstr = "1"
crc32fast = "1"
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc.workspace = true
memchr = "2.8.3"
mold-common.workspace = true
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1"
uuid = { version = "1.27", default-features = false, features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
cc = "1"
