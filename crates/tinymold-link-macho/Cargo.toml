[package]
name = "tinymold-link-macho"
version.workspace = true
edition.workspace = true
# mold needs a newer compiler than the rest of the workspace (let chains and
# other 1.95 features), and keeps its own MIT license; see FORK.md.
rust-version = "1.95"
license = "MIT"
repository.workspace = true
description = "tinymold-link's Mach-O linker, forked from mold-macho"

[lib]
path = "lib.rs"

[dependencies]
hashbrown = "0.17"
libc.workspace = true
memchr = "2.8.3"
memmap2 = "0.9"
mold-common.workspace = true
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1.12.0"
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11"
uuid = { version = "1.27", default-features = false, features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
