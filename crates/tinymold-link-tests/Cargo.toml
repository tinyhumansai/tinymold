[package]
name = "tinymold-link-tests"
version.workspace = true
edition.workspace = true
# mold needs a newer compiler than the rest of the workspace (let chains and
# other 1.95 features), and keeps its own MIT license; see FORK.md.
rust-version = "1.95"
license = "MIT"
repository.workspace = true
description = "Runs tinymold-link against mold's shell test suite"
publish = false

[lib]
path = "lib.rs"

[dependencies]
libc.workspace = true
serde_json = "1.0.151"
